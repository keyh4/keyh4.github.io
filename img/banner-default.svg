<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#edd5c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8ccb0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ddd0;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#e8ccb0;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#g1)"/>
  <!-- Geometric accent shapes -->
  <circle cx="120" cy="80" r="200" fill="url(#g2)" opacity="0.5"/>
  <circle cx="700" cy="320" r="160" fill="url(#g2)" opacity="0.4"/>
  <rect x="550" y="30" width="120" height="120" rx="20" fill="url(#g2)" opacity="0.35" transform="rotate(15, 610, 90)"/>
  <!-- Minimal dots pattern -->
  <g fill="#c47a5a" opacity="0.12">
    <circle cx="200" cy="50" r="3"/>
    <circle cx="230" cy="80" r="2"/>
    <circle cx="180" cy="100" r="2.5"/>
    <circle cx="600" cy="350" r="2"/>
    <circle cx="640" cy="370" r="3"/>
    <circle cx="620" cy="330" r="2"/>
    <circle cx="400" cy="30" r="2.5"/>
    <circle cx="420" cy="60" r="2"/>
  </g>
</svg>
