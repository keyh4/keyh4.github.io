<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c47a5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4946a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" />
  <!-- Letter 'k' in white, geometric style -->
  <g transform="translate(34, 22)" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical stem -->
    <path d="M 0,8 L 0,76" />
    <!-- Upper diagonal -->
    <path d="M 0,32 L 28,8" />
    <!-- Lower diagonal -->
    <path d="M 14,44 L 30,76" />
  </g>
</svg>
