  <div class="search-panel" hidden data-search-panel>
    <div class="search-shell">
      <button class="search-close" type="button" aria-label="Close search" data-search-close>×</button>
      <label class="search-label" for="site-search-input">search</label>
      <input id="site-search-input" class="search-input" type="search" autocomplete="off" placeholder="输入关键词" data-search-input>
      <div class="search-results" data-search-results></div>
    </div>
  </div>
  <script>
  (function () {
    var root = document.documentElement;
    var saved = localStorage.getItem('kayhs-color-scheme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-user-color-scheme', saved || (prefersDark ? 'dark' : 'light'));
    var toggle = document.querySelector('[data-theme-toggle]');
    if (toggle) toggle.addEventListener('click', function () {
      var next = root.getAttribute('data-user-color-scheme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-user-color-scheme', next);
      localStorage.setItem('kayhs-color-scheme', next);
    });
    var panel = document.querySelector('[data-search-panel]');
    var open = document.querySelector('[data-search-open]');
    var close = document.querySelector('[data-search-close]');
    var input = document.querySelector('[data-search-input]');
    var results = document.querySelector('[data-search-results]');
    var index = [];
    function escapeHtml(text) { return text.replace(/[&<>"']/g, function (ch) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]; }); }
    function showPanel() { panel.hidden = false; requestAnimationFrame(function () { if (input) input.focus(); }); }
    function hidePanel() { panel.hidden = true; }
    function render(value) {
      var q = value.trim().toLowerCase();
      if (!q) { results.innerHTML = '<p class="search-empty">输入关键词开始搜索。</p>'; return; }
      var found = index.filter(function (item) { return (item.title + ' ' + item.content).toLowerCase().indexOf(q) !== -1; }).slice(0, 8);
      results.innerHTML = found.length ? found.map(function (item) {
        return '<a class="search-hit" href="' + item.url + '"><strong>' + escapeHtml(item.title) + '</strong><span>' + escapeHtml(item.content.replace(/<[^>]+>/g, '').slice(0, 96)) + '</span></a>';
      }).join('') : '<p class="search-empty">没有匹配结果。</p>';
    }
    if (open && panel) open.addEventListener('click', showPanel);
    if (close && panel) close.addEventListener('click', hidePanel);
    if (input) input.addEventListener('input', function () { render(input.value); });
    document.addEventListener('keydown', function (event) { if (event.key === 'Escape' && panel && !panel.hidden) hidePanel(); });
    fetch('/local-search.xml').then(function (res) { return res.text(); }).then(function (text) {
      var doc = new DOMParser().parseFromString(text, 'application/xml');
      index = Array.prototype.map.call(doc.querySelectorAll('entry'), function (entry) {
        return { title: entry.querySelector('title') ? entry.querySelector('title').textContent : 'untitled', url: entry.querySelector('url') ? entry.querySelector('url').textContent : '#', content: entry.querySelector('content') ? entry.querySelector('content').textContent : '' };
      });
    }).catch(function () {});
  })();
  </script>
